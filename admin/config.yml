# Bukhara Tech boshqaruv paneli (Sveltia CMS). Panel content/*.json ni tahrirlaydi,
# saqlangach GitHub Action (.github/workflows/cms.yml) tools/build.py orqali 18 sahifani yangilaydi.
# (Fayl YAML anchor/merge'larsiz — Sveltia uchun to'liq yoyilgan.)
backend:
  name: github
  repo: sadullakhaitov/bukhara-tech
  branch: main
  commit_messages:
    update: 'Admin panel: {{collection}} yangilandi'
    uploadMedia: 'Admin panel: rasm yuklandi — {{path}}'
    deleteMedia: 'Admin panel: rasm o''chirildi — {{path}}'
media_folder: images/uploads
public_folder: /images/uploads
site_url: https://bukharatech.uz
display_url: https://bukharatech.uz
collections:
- name: sayt
  label: Sayt ma'lumotlari
  editor:
    preview: false
  files:
  - name: sharhlar
    label: Mijozlar sharhlari
    file: content/sharhlar.json
    fields:
    - name: sharhlar
      label: Sharhlar
      label_singular: Sharh
      widget: list
      summary: '{{fields.ism.uz}} — {{fields.mavzu.uz}}'
      fields:
      - name: yonalish
        label: Yo'nalish (rangi)
        widget: select
        options:
        - label: Kamera
          value: p-cam
        - label: Internet / IT
          value: p-net
        - label: Sayt va bot
          value: p-web
        - label: Video
          value: p-media
        - label: AI
          value: p-ai
      - name: belgi
        label: Belgi (bo'sh qolsa — yo'nalish belgisi)
        widget: select
        required: false
        options:
        - label: Kompyuter
          value: p-pc
        - label: Kamera
          value: p-cam
        - label: Wi-Fi
          value: p-net
        - label: Sayt
          value: p-web
        - label: Video
          value: p-media
        - label: AI
          value: p-ai
      - name: mavzu
        label: 'Mavzu (masalan: Kamera o''rnatish)'
        widget: object
        fields:
        - name: uz
          label: O'zbekcha
          widget: string
        - name: ru
          label: Ruscha (bo'sh qolsa o'zbekchasi)
          widget: string
          required: false
        - name: en
          label: Inglizcha (bo'sh qolsa o'zbekchasi)
          widget: string
          required: false
      - name: matn
        label: Sharh matni
        widget: object
        fields:
        - name: uz
          label: O'zbekcha
          widget: text
        - name: ru
          label: Ruscha (bo'sh qolsa o'zbekchasi)
          widget: text
          required: false
        - name: en
          label: Inglizcha (bo'sh qolsa o'zbekchasi)
          widget: text
          required: false
      - name: ism
        label: Mijoz ismi
        widget: object
        fields:
        - name: uz
          label: O'zbekcha
          widget: string
        - name: ru
          label: Ruscha (bo'sh qolsa o'zbekchasi)
          widget: string
          required: false
        - name: en
          label: Inglizcha (bo'sh qolsa o'zbekchasi)
          widget: string
          required: false
      - name: joy
        label: 'Kim / qayerdan (masalan: Do''kon egasi, Peshku)'
        widget: object
        fields:
        - name: uz
          label: O'zbekcha
          widget: string
        - name: ru
          label: Ruscha (bo'sh qolsa o'zbekchasi)
          widget: string
          required: false
        - name: en
          label: Inglizcha (bo'sh qolsa o'zbekchasi)

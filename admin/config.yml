    label: 'Narxlar: xizmat kartalari'
    file: content/xizmatlar.json
    fields:
    - name: kartalar
      label: Bosh sahifadagi xizmat kartalari
      label_singular: Karta
      widget: list
      summary: '{{fields.sarlavha.uz}} — {{fields.narx}}'

# Bukhara Tech boshqaruv paneli (Sveltia CMS). Panel content/*.json ni tahrirlaydi,
# saqlangach GitHub Action (.github/workflows/cms.yml) tools/build.py orqali 12 sahifani yangilaydi.
# (Fayl YAML anchor/merge'larsiz — Sveltia uchun to'liq yoyilgan.)
backend:
  name: github
  repo: sadullakhaitov/bukhara-tech
  branch: main
  commit_messages:
    update: 'Admin panel: {{collection}} yangilandi'
    uploadMedia: 'Admin panel: rasm yuklandi — {{path}}'
    deleteMedia: 'Admin panel: rasm o''chirildi — {{path}}'
media_folder: images/uploads
public_folder: /images/uploads
site_url: https://bukharatech.uz
display_url: https://bukharatech.uz
collections:
- name: sayt
  label: Sayt ma'lumotlari
  editor:
    preview: false
  files:
  - name: men
    label: Men haqimda
    file: content/men.json
    fields:
    - name: rasm
      label: Rasmingiz (bo'sh bo'lsa bosh harflar ko'rinadi)
      widget: image
      required: false
    - name: ism
      label: Ism
      widget: object
      fields:
      - name: uz
        label: O'zbekcha
        widget: string
      - name: ru
        label: Ruscha (bo'sh qolsa o'zbekchasi)
        widget: string
        required: false
      - name: en
        label: Inglizcha (bo'sh qolsa o'zbekchasi)
        widget: string
        required: false
    - name: bosh_harflar
      label: Bosh harflar (rasm yo'q bo'lsa)
      widget: string
    - name: staj
      label: Tajriba (yil) — bosh sahifada ham ko'rinadi
      widget: number
      value_type: int
      min: 0
    - name: lavozim
      label: Kasbingiz (qisqa)
      widget: object
      fields:
      - name: uz
        label: O'zbekcha
        widget: string
      - name: ru
        label: Ruscha (bo'sh qolsa o'zbekchasi)
        widget: string
        required: false
      - name: en
        label: Inglizcha (bo'sh qolsa o'zbekchasi)
        widget: string
        required: false
    - name: tavsif
      label: O'zingiz haqingizda
      widget: object
      fields:
      - name: uz
        label: O'zbekcha
        widget: text
      - name: ru
        label: Ruscha (bo'sh qolsa o'zbekchasi)
        widget: text
        required: false
      - name: en
        label: Inglizcha (bo'sh qolsa o'zbekchasi)
        widget: text
        required: false
    - name: teglar
      label: Teglar
      label_singular: Teg
      widget: list
      summary: '{{fields.uz}}'
      fields:
      - name: uz
        label: O'zbekcha
        widget: string
      - name: ru
        label: Ruscha (bo'sh qolsa o'zbekchasi)
        widget: string
        required: false
      - name: en
        label: Inglizcha (bo'sh qolsa o'zbekchasi)
        widget: string
        required: false
    - name: kompaniyalar
      label: Kompaniyalarim (havola bilan)
      label_singular: Kompaniya
      widget: list
      required: false
      summary: '{{fields.nomi}}'
      fields:
      - name: nomi
        label: Nomi
        widget: string
      - name: havola
        label: Sayti (https://...)
        widget: string
